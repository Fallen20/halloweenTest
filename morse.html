<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find the code</title>

    <style>
      :root {
        --background: #0d0b0b;
        --background-light: #171212;
        --panel: #1e1818;
        --panel-dark: #110c0c;
        --text: #d8d0ca;
        --text-muted: #928783;
        --red: #8f1d1d;
        --red-dark: #5a0e0e;
        --gold: #b99a5b;
        --gold-light: #f0d9a0;
        --border: #493b30;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        padding: 2rem;

        background: radial-gradient(circle at center, var(--background-light) 0%, var(--background) 70%);

        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
      }

      /* =========================================
         LAYOUT PRINCIPAL
         ========================================= */

      #main-layout {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;

        display: grid;
        grid-template-columns: minmax(280px, 0.35fr) minmax(600px, 1fr);
        gap: 3rem;

        align-items: start;
      }

      /* =========================================
         COLUMNA IZQUIERDA
         ========================================= */

      #panel-section {
        padding: 2rem;

        background: rgba(30, 24, 24, 0.95);

        border: 1px solid rgba(185, 154, 91, 0.25);
        border-radius: 10px;

        box-shadow:
          0 10px 40px rgba(0, 0, 0, 0.6),
          inset 0 0 25px rgba(0, 0, 0, 0.25);

        text-align: center;
      }

      #panel-section h1 {
        margin-top: 0;
        margin-bottom: 1.5rem;

        color: var(--gold);

        font-size: 2rem;

        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      }

      #description {
        margin-bottom: 2rem;

        color: var(--text);

        line-height: 1.7;
      }

      /* =========================================
         PANEL NUMÉRICO
         ========================================= */

      #inputNum {
        width: 200px;
        min-height: 55px;

        margin: 0 auto 1.5rem;

        padding: 0.5rem;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #0b0808;

        color: var(--gold-light);

        border: 2px solid var(--gold);
        border-radius: 4px;

        font-size: 1.6rem;
        letter-spacing: 0.2em;

        box-shadow:
          inset 0 0 15px rgba(0, 0, 0, 0.7),
          0 0 10px rgba(185, 154, 91, 0.15);
      }

      /* =========================================
         TECLADO
         ========================================= */

      #button-container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .button-row {
        display: flex;
        justify-content: center;
        margin: 4px 0;
      }

      .custom-button {
        width: 55px;
        height: 48px;

        margin: 0 4px;

        background: var(--red-dark);

        color: var(--gold-light);

        border: 1px solid var(--gold);
        border-radius: 5px;

        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.1rem;
        font-weight: bold;

        cursor: pointer;

        transition:
          background 0.2s ease,
          color 0.2s ease,
          transform 0.1s ease;
      }

      .custom-button:hover {
        background: #761414;

        color: white;

        border-color: #f8f2cc;
      }

      .custom-button:active {
        transform: scale(0.95);
      }

      /* =========================================
         RESULTADO DEL CÓDIGO
         ========================================= */

      #result {
        margin-top: 1.5rem;

        padding: 1rem;

        background: #11140e;

        border: 1px solid #8c9b56;
        border-radius: 5px;

        text-align: center;
      }

      #result a {
        color: #fe5d5d;
      }

      #text {
        margin-top: 1rem;

        color: var(--text-muted);

        text-align: center;
        font-style: italic;
      }

      /* =========================================
         COLUMNA DERECHA
         ========================================= */

      #room-section {
        width: 100%;
      }

      /* =========================================
         IMAGEN + BOTONES
         ========================================= */

      #contenedor {
        position: relative;

        width: 100%;

        background: #080707;

        border: 1px solid rgba(185, 154, 91, 0.3);
        border-radius: 8px;

        overflow: hidden;

        box-shadow:
          0 10px 40px rgba(0, 0, 0, 0.7),
          inset 0 0 30px rgba(0, 0, 0, 0.5);
      }

      #image {
        display: block;

        width: 100%;
        height: auto;
      }

      /* =========================================
         BOTONES SOBRE LA IMAGEN
         ========================================= */

      #contenedor > button {
        position: absolute;

        z-index: 10;

        margin: 0;

        padding: 0.5rem 1rem;

        background: var(--red-dark);

        color: var(--gold-light);

        border: 1px solid var(--gold);
        border-radius: 5px;

        font-family: Georgia, "Times New Roman", serif;
        font-size: 0.9rem;
        font-weight: bold;

        cursor: pointer;

        transform: translate(-50%, -50%);

        transition:
          background 0.2s ease,
          transform 0.1s ease;
      }

      #contenedor > button:hover {
        background: #761414;

        color: white;

        border-color: #f8f2cc;

        transform: translate(-50%, -50%) scale(1.05);
      }

      #contenedor > button.disabled {
        opacity: 0.45;

        cursor: not-allowed;
      }

      /* =========================================
         INFORMACIÓN
         ========================================= */

      #info-container {
        width: 100%;

        margin-top: 1.5rem;
      }

      .info-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
      }

      .info-box {
        min-height: 100px;

        padding: 1.2rem;

        background: rgba(17, 12, 12, 0.95);

        border: 1px solid rgba(185, 154, 91, 0.35);
        border-radius: 6px;

        color: var(--text);

        line-height: 1.6;

        opacity: 0;

        transition: opacity 0.3s ease;
      }

      .info-box.active {
        opacity: 1;
      }

      #specialBox {
        margin-top: 1rem;

        padding: 1.5rem;

        background: rgba(17, 12, 12, 0.98);

        border: 1px solid var(--gold);
        border-radius: 6px;

        text-align: center;

        opacity: 0;
      }

      #specialBox.active {
        opacity: 1;
      }

      #specialBox img {
        max-width: 150px;
        width: auto;
        height: auto;
        margin: 1rem auto 0;
        display: block;
      }

      a {
        color: #fe5d5d;

        text-decoration: underline;
        text-decoration-color: #fe5d5d;
      }

      strong {
        color: #c52f9a;
      }

      /* =========================================
         RESPONSIVE
         ========================================= */

      @media (max-width: 1000px) {
        #main-layout {
          grid-template-columns: 1fr;
        }

        #panel-section {
          max-width: 700px;
          width: 100%;
          margin: 0 auto;
        }

        #room-section {
          width: 100%;
        }
      }

      @media (max-width: 700px) {
        body {
          padding: 1rem;
        }

        #main-layout {
          gap: 1.5rem;
        }

        .info-row {
          grid-template-columns: 1fr;
        }

        #panel-section {
          padding: 1.5rem;
        }
      }

      #search-log {
    margin-top: 2rem;
    padding: 1rem;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid #555;
    border-radius: 8px;
}

#search-log h3 {
    margin-top: 0;
    margin-bottom: 1rem;
    text-align: center;
}

.search-log-entry {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 0.7rem 0.8rem;
    margin-bottom: 0.5rem;

    background: rgba(255, 255, 255, 0.05);
    border-radius: 5px;

    font-size: 0.9rem;
}

.search-log-item{
  margin-bottom: 1.5rem;
}
    </style>
  </head>

  <body>
    <main id="main-layout">
      <!-- =====================================
           PANEL / CÓDIGO
           ===================================== -->

      <section id="panel-section">
        <div id="description">Suddenly, the door closes behind you. You are left in the room where a panel is located at the other end, next to another door. Seems to only accept numbers.</div>

        <div id="inputNum"></div>

        <div id="button-container">
          <div class="button-row">
            <button class="custom-button" onclick="inputCode(this.innerText)">1</button>
            <button class="custom-button" onclick="inputCode(this.innerText)">2</button>
            <button class="custom-button" onclick="inputCode(this.innerText)">3</button>
          </div>

          <div class="button-row">
            <button class="custom-button" onclick="inputCode(this.innerText)">4</button>
            <button class="custom-button" onclick="inputCode(this.innerText)">5</button>
            <button class="custom-button" onclick="inputCode(this.innerText)">6</button>
          </div>

          <div class="button-row">
            <button class="custom-button" onclick="inputCode(this.innerText)">7</button>
            <button class="custom-button" onclick="inputCode(this.innerText)">8</button>
            <button class="custom-button" onclick="inputCode(this.innerText)">9</button>
          </div>

          <div class="button-row">
            <button class="custom-button" style="width: 170px" onclick="inputCode(this.innerText)">0</button>
          </div>
        </div>

        <div id="result" style="display: none"></div>

        <!-- <div id="text" style="display: none"></div> -->
        <div id="search-log">
          <h3>Search log</h3>

          <div id="search-log-list">
          </div>
        </div>
      </section>

      <!-- =====================================
           HABITACIÓN
           ===================================== -->

      <section id="room-section">
        <div id="contenedor">
          <img id="image" src="habitaciones/Morse_room.png" alt="Imagen de la habitación" />
        </div>

        <!-- =================================
             INFORMACIÓN
             ================================= -->

        <div id="info-container" style="display: none">
          <div class="info-row">
            <div class="info-box"></div>

            <div class="info-box"></div>

            <div class="info-box"></div>
          </div>

          <div id="specialBox"></div>
        </div>
      </section>
    </main>

    <script src="morse.js"></script>
  </body>
</html>
