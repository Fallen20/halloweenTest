<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Final Room</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./LORE/styles.css" />
    <style>
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        max-width: 500px;
        width: 100%;
        text-align: center;
      }

      .celestial-input {
        font-size: 1.2rem;
        font-family: "Georgia", serif;
        color: #6b5b95;
        text-align: center;
        border: 2px solid #d4af37;
        border-radius: 8px;
        box-shadow: 0px 0px 15px rgba(212, 175, 55, 0.4);
      }
      .celestial-input:focus {
        outline: none;
        box-shadow: 0px 0px 20px rgba(212, 175, 55, 0.6);
      }
      /* =========================================
   THE FINAL ROOM
   ========================================= */

      /* Contenedor de los mensajes finales */
      #resultMessage,
      #errorMessage {
        display: none;

        margin-top: 2rem;
        padding: 1.8rem 2rem;

        border-radius: 4px;

        font-family: var(--font-body);
        font-size: 1.05rem;
        font-style: italic;
        line-height: 1.7;

        text-align: center;

        position: relative;

        transition:
          box-shadow 0.4s ease,
          border-color 0.4s ease;

        animation: finalMessageAppear 0.7s ease forwards;
      }

      /* =========================================
   CORRECT ANSWER
   ========================================= */

      #resultMessage {
        background: radial-gradient(circle at center, rgba(111, 89, 50, 0.18), rgba(17, 14, 12, 0.98) 75%);

        color: #d7dcbf;

        border: 1px solid var(--color-gold);

        box-shadow:
          0 0 15px rgba(185, 154, 91, 0.15),
          0 10px 35px rgba(0, 0, 0, 0.7),
          inset 0 0 25px rgba(185, 154, 91, 0.05);
      }

      /* =========================================
   WRONG ANSWER
   ========================================= */

      #errorMessage {
        background: radial-gradient(circle at center, rgba(143, 29, 29, 0.2), rgba(24, 9, 9, 0.98) 75%);

        color: #d8bebe;

        border: 1px solid var(--color-red);

        box-shadow:
          0 0 18px rgba(143, 29, 29, 0.25),
          0 10px 35px rgba(0, 0, 0, 0.75),
          inset 0 0 30px rgba(143, 29, 29, 0.08);

        animation:
          finalMessageAppear 0.7s ease forwards,
          godGaze 2.5s ease-in-out 0.7s;
      }

      /* "its" */

      #errorMessage strong {
        color: #f2c40e;

        font-weight: normal;

        text-shadow: 0 0 8px rgba(242, 196, 14, 0.35);
      }
    </style>
  </head>
  <body class="">
    <div class="container shadow p-4 rounded" style="">
      <h2 class="text-center mb-4">The Final Room</h2>
      <p class="mb-4">“We divided for God’s calling”</p>

      <!-- Celestial Input -->
      <input type="text" id="celestialInput" class="form-control celestial-input" maxlength="8" placeholder="Enter the code..." />

      <!-- Check Button -->
      <div class="text-center mt-4">
        <button id="checkButton" class="btn btn-primary" onclick="checkCode()">Check</button>
      </div>

      <!-- Result Message -->
      <div id="resultMessage" class="result-message">
        You hear a cracking sound as something opens. You hear a whisper and you're drawn to continue.
        <a href="./LORE/Escape.html" class="">Proceed</a>.
      </div>

      <div id="errorMessage" class="error-message">Something went very wrong. You can see <strong style="color: #f2c40e">its</strong> gaze upon you.</div>
    </div>

    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      function checkCode() {
        // Get the input value and convert to lowercase
        const celestialInput = document.getElementById("celestialInput");
        const checkButton = document.getElementById("checkButton");
        const resultMessage = document.getElementById("resultMessage");
        const errorMessage = document.getElementById("errorMessage");

        // Check if input matches "scutumus"
        if (celestialInput.value.trim().toLowerCase() === "scutumus") {
          // Display result message
          resultMessage.style.display = "block";
          errorMessage.style.display = "none";

          // Disable input and button
          celestialInput.disabled = true;
          checkButton.disabled = true;
        } else {
          errorMessage.style.display = "block";
          resultMessage.style.display = "none";
        }
      }
    </script>
  </body>
</html>
