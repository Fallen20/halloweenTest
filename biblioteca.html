<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script src="biblioteca.js"></script>
    <link rel="stylesheet" href="./LORE/styles.css" />
    <style>
      /* Contenedor relativo para superposición de imágenes */
      .image-stack {
        position: relative;
        max-width: 90%;
        /* Ajusta el tamaño según necesites */
        height: auto;
        margin-top: 20px;
      }

      /* Imagen base */
      .imagenBase {
        width: 100%;
        height: auto;
        max-height: 70vh;
        /* Limita la altura para evitar scroll */
      }

      /* Imagen superpuesta */
      .imagenOverlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      .botonSobreImagen {
        position: absolute;
        z-index: 2;
        /* Más alto que las imágenes */
        padding: 10px 20px;
        /* color: white; */
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      #collection {
        position: relative;
        /* Permitir la superposición de imágenes dentro */
        height: 300px;
        /* Ajusta la altura del contenedor según lo necesites */
        overflow: hidden;
        /* Evitar que las imágenes se desborden */
        display: flex;
        /* Cambia el display a flex */
        flex-wrap: wrap;
        /* Permitir que los elementos se envuelvan */
      }

      .imagenLibroSide {
        max-width: 200px;
        /* Aumenta el tamaño máximo de la imagen */
        /* max-height:2 300px; */
        /* Aumenta la altura máxima de la imagen */
        object-fit: cover;
        /* Asegura que la imagen mantenga su proporción */
        margin: 0;
        /* Sin margen para evitar espacios */
        position: absolute;
        /* Cambiar a absoluto para permitir la superposición */
      }


      /* =========================================
   HALLOWEEN ESCAPE ROOM — SELECTS
   ========================================= */

select.botonSobreImagen {
  position: absolute;

  min-width: 120px;
  min-height: 42px;

  padding: 0.45rem 2rem 0.45rem 0.8rem;

  background: #0b0808 !important;

  color: #d6c6b5 !important;

  border: 2px solid #8f4b20 !important;
  border-radius: 3px;

  font-family: Georgia, "Times New Roman", serif;
  font-size: 1rem;
  font-weight: normal;

  text-align: center;

  cursor: pointer;

  box-shadow:
    0 4px 10px rgba(0, 0, 0, 0.8),
    inset 0 0 8px rgba(143, 75, 32, 0.15);

  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    color 0.2s ease,
    box-shadow 0.2s ease;
}


/* =========================================
   HOVER
   ========================================= */

select.botonSobreImagen:hover {
  background: #160c08 !important;

  color: #e5a15b !important;

  border-color: #b85c24 !important;

  box-shadow:
    0 0 10px rgba(184, 92, 36, 0.35),
    0 5px 15px rgba(0, 0, 0, 0.8),
    inset 0 0 10px rgba(184, 92, 36, 0.08);
}


/* =========================================
   FOCUS
   ========================================= */

select.botonSobreImagen:focus {
  outline: none;

  background: #160c08 !important;

  color: #f0b36a !important;

  border-color: #d06a2c !important;

  box-shadow:
    0 0 0 1px #8f4b20,
    0 0 15px rgba(184, 92, 36, 0.4);
}


/* =========================================
   OPTIONS
   ========================================= */

select.botonSobreImagen option {
  background: #0b0808;

  color: #d6c6b5;

  font-family: Georgia, "Times New Roman", serif;
}


/* Opción seleccionada */

select.botonSobreImagen option:checked {
  background: #3a140d;

  color: #e5a15b;
}
    </style>
  </head>

  <body>
    <div>
      <div class="fw-bold h1 text-center">Find the correct answer to open the door</div>

      <div id="result" class="text-center"></div>

      <div class="container d-flex justify-content-center align-items-center">
        <div class="me-5">
          <div class="fw-bold h5">Here will be the objects you collect</div>
          <div id="collection"></div>
        </div>
        <div class="image-stack" id="imageContainer">
          <img src="biblioteca/base.png" id="ImagenBase" class="img-fluid imagenBase" />
        </div>
      </div>
    </div>
  </body>
</html>
