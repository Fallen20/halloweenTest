<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elements</title>
    <script src="elemental.js"></script>
    <link rel="stylesheet" href="glich.css" />
    <link rel="stylesheet" href="./LORE/styles.css" />
    <style>
      .shake {
        animation: shake 0.5s infinite;
        /* Llama a la animación 'shake' */
      }

      @keyframes shake {
        0% {
          transform: translate(-50%, -50%) translate(0, 0);
        }

        10% {
          transform: translate(-50%, -50%) translate(-5px, -5px);
        }

        20% {
          transform: translate(-50%, -50%) translate(5px, 5px);
        }

        30% {
          transform: translate(-50%, -50%) translate(-5px, 0);
        }

        40% {
          transform: translate(-50%, -50%) translate(5px, -5px);
        }

        50% {
          transform: translate(-50%, -50%) translate(0, 5px);
        }

        60% {
          transform: translate(-50%, -50%) translate(-5px, 5px);
        }

        70% {
          transform: translate(-50%, -50%) translate(5px, 0);
        }

        80% {
          transform: translate(-50%, -50%) translate(0, -5px);
        }

        90% {
          transform: translate(-50%, -50%) translate(-5px, -5px);
        }

        100% {
          transform: translate(-50%, -50%) translate(0, 0);
        }
      }
    </style>
  </head>

  <body>
    <div class="mb-4">
      <h1 class="text-center whiteTitle">Elemental</h1>
      <hr class="hrWhiteTitle" />
      <h2 class="fw-bold" style="font-size: 17px">Additional hints will be added here</h2>
      <div style="height: 100px; overflow-y: auto">
        <div style="font-style: italic; color: #d8d0ca; font-size: 16px" class="">Scroll to see all</div>
        <div id="hints" style="display: none"></div>
        <div id="hintsReal" style="display: none"></div>
      </div>
    </div>

   <div class="container" style="margin-top: 0;">
  <div id="result" class="text-center whiteTitleLittle mb-3 mt-0" style="display: none"></div>
  <div class="row">
    
    <div class="col-3 d-flex justify-content-end pe-3">
      <div class="btn botonLados" id="turnLeftButton">&lt;-</div>
    </div>

    <div class="col-6 text-center" id="imageDiv">
      <!-- Añadir text-center para centrar el contenido -->
      <img src="elemental/elemental_0010_delante.png" alt="" class="img-fluid mx-auto d-block" style="" id="image" />
    </div>

    <div id="rightColumn" class="col-3 d-flex ps-3">
      <div class="btn botonLados  w-25" id="turnRightButton">-&gt;</div>
    </div>

  </div>
</div>
  </body>
</html>
