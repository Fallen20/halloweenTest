<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoku 9x9</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        color: var(--color-text);
        font-family: var(--font-body);
        font-size: 18px;
        line-height: 1.8;

        text-rendering: optimizeLegibility;
      }

      body > div {
        width: 70%;
        max-width: 900px;

        margin: 20px auto !important;
        padding: var(--content-padding);

        border-radius: 10px;

        background: rgba(30, 24, 24, 0.95);

        border: 1px solid rgba(185, 154, 91, 0.25);
      }

      input {
        font-style: normal !important;
      }

      table {
        border-collapse: collapse;
        /* Asegúrate de que los bordes se colapsen */
      }

      td {
        width: 40px;
        height: 40px;
        text-align: center;
        font-size: 18px;
        border: 2px solid transparent;
        /* Usar bordes transparentes inicialmente */
      }

      input {
        width: 100%;
        height: 100%;
        text-align: center;
        font-size: 18px;
        background-color: #fff;
      }

      input[readonly] {
        background-color: #f0f0f0;
      }

      button {
        margin-top: 20px; /* Espacio entre la tabla y el botón */
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
    <script src="sudoku.js"></script>
    <link rel="stylesheet" href="./LORE/styles.css" />
  </head>

  <body>
    <div style="" class="">
      <div id="salto" style="display: none; width: 100%; text-align: center; margin: 0 auto 1rem"></div>
      <table id="sudoku-table" class=""></table>
      <button class="btn btn-primary" id="check-button">Check answer</button>

    </div>
  </body>
</html>
