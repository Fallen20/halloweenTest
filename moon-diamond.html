<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun and moon</title>
    <script src="moon-diamond.js"></script>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: white;
      }

      .container {
        position: relative;
        width: 600px;
        height: 400px;
        overflow: visible;
        background-image: url("habitaciones/moonDiamond_room.png");
        background-size: cover;
        background-position: center;
      }

      .draggable {
        width: 50px;
        height: 50px;
        position: absolute;
      }

      .button {
        width: 50px;
        height: 50px;
        background-size: contain;
        /* Ajusta el tamaño para que la imagen esté completamente visible */
        background-position: center;
        /* Centra la imagen */
        background-repeat: no-repeat;
        /* Evita que se repita */
        cursor: grab;
      }

      .button1 {
        background-image: url("habitaciones/moonDrag.png");
        position: absolute;
        bottom: 10px;
        left: 10px;
      }

      .button2 {
        background-image: url("habitaciones/diamondDrag.png");
        position: absolute;
        bottom: 10px;
        right: 10px;
      }

      .img1 {
        width: 50px;
        height: 50px;
      }

      #actionButton1 {
        display: none;
        position: absolute;
        top: calc(40% + 60px);
        /* Separación de img1 */
        left: 15%;
        padding: 10px;
        background-color: #4caf50;
        color: white;
        border: none;
        cursor: pointer;
      }

      #actionButton2 {
        display: none;
        position: absolute;
        top: calc(40% + 60px);
        /* Separación de img2 */
        right: 15%;
        padding: 10px;
        background-color: #4caf50;
        color: white;
        border: none;
        cursor: pointer;
      }

      #mobile {
        display: none;
      }

      @media (max-width: 768px) {
        #mobile {
          display: block;
          padding: 20px;
        }
        body {
          display: flex;
          flex-direction: column;
        }
      }
   
   
   </style>
    <link rel="stylesheet" href="./LORE/styles.css" />
  </head>

  <body>
    <div id="mobile" class="w-100">If you're in movile you are not able to do this puzzle. Click here to <a href="./LORE/Moon_corridor.html">continue</a>, forgive me</div>

   <div id="game">

    <div
        id="title"
        style="
            color: #d8d0ca;
            font-size: 2.5rem;
            font-family: Georgia, 'Times New Roman', serif;
            text-align: center;
        "
    >
        O lua, eu estrela
    </div>

    <div class="container" style="margin:0 auto;">

        <img
            src="habitaciones/moonNone.png"
            class="draggable img1"
            id="img1"
            style="top: 40%; left: 20%;"
        />

        <img
            src="habitaciones/diamondNone.png"
            class="draggable"
            id="img2"
            style="top: 40%; right: 20%;"
        />

        <div class="button button1" id="button1"></div>
        <div class="button button2" id="button2"></div>

        <button id="actionButton1">Open left door</button>
        <button id="actionButton2">Open right door</button>

    </div>

</div>

  </body>
</html>
